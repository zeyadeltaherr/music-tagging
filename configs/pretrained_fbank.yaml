name: ast_official_fbank
seeds: [0, 1, 2]

data:
  kind: mtat_ast
  root: "C:/mtat_data"

model:
  name: ast
  params:
    checkpoint: "MIT/ast-finetuned-audioset-10-10-0.4593"
    freeze_backbone: true
    target_length: 1024
    input_mean: -4.2677393
    input_std: 4.5689974
    dropout: 0.2

train:
  epochs: 3
  batch_size: 1
  eval_batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  amp: true
  augment: false
  patience: 3
  num_workers: 0

output:
  results_dir: experiments
  ckpt_dir: checkpoints